                + '<circle cx="55" cy="48" r="4.5" fill="#e2e8f0"/>';
            const gaugeNeedleEl = gaugeSvg.querySelector('.gauge-needle');
            timeBlock.appendChild(gaugeSvg);

            // 18. Liquid Wave fill & 19. Tape giant watermark
            const waveWrap = document.createElement('div');
            waveWrap.className = 'face-wave-wrap';
            const tapeBg = document.createElement('div');
            tapeBg.className = 'face-tape-bg';
            tapeBg.setAttribute('aria-hidden', 'true');

            // 20. Sand Hourglass SVG
            const hourglassSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            hourglassSvg.setAttribute('class', 'face-hourglass-svg');
            hourglassSvg.setAttribute('viewBox', '0 0 56 76');
            hourglassSvg.setAttribute('aria-hidden', 'true');
            hourglassSvg.innerHTML =
                '<defs><clipPath id="hgTop_' + clockData.id + '"><polygon points="8,8 48,8 28,37"/></clipPath>'
                + '<clipPath id="hgBot_' + clockData.id + '"><polygon points="28,39 8,68 48,68"/></clipPath></defs>'
                + '<rect class="hg-top-sand" x="6" y="8" width="44" height="30" fill="#f59e0b" clip-path="url(#hgTop_' + clockData.id + ')"/>'
                + '<rect class="hg-bot-sand" x="6" y="38" width="44" height="30" fill="#f59e0b" clip-path="url(#hgBot_' + clockData.id + ')"/>'
                + '<line x1="28" y1="37" x2="28" y2="68" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.2" stroke-dasharray="2 2"/>'
                + '<polygon points="8,8 48,8 28,37" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
                + '<polygon points="28,39 8,68 48,68" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
                + '<line x1="5" y1="8" x2="51" y2="8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>'
                + '<line x1="5" y1="68" x2="51" y2="68" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>';
            const hgTopSand = hourglassSvg.querySelector('.hg-top-sand');
            const hgBotSand = hourglassSvg.querySelector('.hg-bot-sand');
            timeBlock.appendChild(hourglassSvg);

            timeBlock.appendChild(dateMetaCol);

            // Subtle bottom 24h interactive bar
            const dayStrip = document.createElement('div');
            dayStrip.className = 'day-strip';
            dayStrip.title = 'Click or drag to jump to an hour in this timezone';

            const workBar = document.createElement('div');
            workBar.className = 'day-strip-work';

            const workBar2 = document.createElement('div');
            workBar2.className = 'day-strip-work';
            workBar2.style.display = 'none';

            const nowMarker = document.createElement('div');
            nowMarker.className = 'day-strip-now';

            dayStrip.appendChild(workBar);
            dayStrip.appendChild(workBar2);
            dayStrip.appendChild(nowMarker);

            setupStripScrubbing(dayStrip, clockData.id);
            setupCardDrag(card, clockData.id);

            card.addEventListener('mouseenter', () => {
                if (hoveredClockId !== clockData.id) {
                    hoveredClockId = clockData.id;
                    drawWorldMap();
                }
            });
            card.addEventListener('mousemove', (e) => {
                if (!canHoverFine || draggingId) return;
                const r = card.getBoundingClientRect();
                const nx = (e.clientX - r.left) / r.width - 0.5;
                const ny = (e.clientY - r.top) / r.height - 0.5;
                card.classList.add('tilting');
                card.style.setProperty('--rx', (-ny * 6).toFixed(2) + 'deg');
                card.style.setProperty('--ry', (nx * 6).toFixed(2) + 'deg');
                card.style.setProperty('--gx', ((nx + 0.5) * 100).toFixed(1) + '%');
                card.style.setProperty('--gy', ((ny + 0.5) * 100).toFixed(1) + '%');
                card.style.setProperty('--glare', '1');
            });
            card.addEventListener('mouseleave', () => {
                card.classList.remove('tilting');
                card.style.setProperty('--rx', '0deg');
                card.style.setProperty('--ry', '0deg');
                card.style.setProperty('--glare', '0');
                if (hoveredClockId === clockData.id) {
                    hoveredClockId = null;
                    drawWorldMap();
                }
            });

            card.appendChild(horizonSvg);
            card.appendChild(waveWrap);
            card.appendChild(tapeBg);
            card.appendChild(head);
            card.appendChild(tzMeta);
            card.appendChild(timeBlock);
            card.appendChild(dayStrip);

            return {
                card,
                els: {
                    flagEl,
                    cityName,
                    tzMeta,
                    headerPill,
                    timeHour,
                    timeMin,
                    timeSec,
                    timeAmpm,
                    dateText,
                    statusTag,
                    dayBadge,
                    analogHourEl,
                    analogMinEl,
                    analogSecEl,
                    radialArcEl,
                    radialPlanetEl,
                    binaryLeds,
                    horizonOrbHalo,
                    horizonOrb,
                    wcChars,
                    nixieDigits,
                    radarSweepEl,
                    radarBlipEl,
                    gaugeNeedleEl,
                    tapeBg,
                    hgTopSand,
                    hgBotSand,
                    workBar,
                    workBar2,
                    nowMarker
                },
                last: {}
            };
        }

        function setupStripScrubbing(stripEl, clockId) {
            let active = false;
            function scrubToPointer(clientX) {
                const clock = clocks.find(c => c.id === clockId);
                if (!clock) return;
                const rect = stripEl.getBoundingClientRect();
                const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                const targetHour = Math.round(ratio * 48) / 2;
                const now = new Date();
                const currentParts = getPartsInZone(now, clock.timezone);
                const currentHourFloat = currentParts.hour + currentParts.minute / 60;
                let diff = targetHour - currentHourFloat;
                diff = Math.max(-24, Math.min(24, Math.round(diff * 2) / 2));
                setTimeOffset(diff);
            }

            stripEl.addEventListener('pointerdown', (e) => {
                active = true;
                isScrubbing = true;
                stripEl.setPointerCapture(e.pointerId);
                scrubToPointer(e.clientX);
            });
            stripEl.addEventListener('pointermove', (e) => {
                if (active) scrubToPointer(e.clientX);
            });
            stripEl.addEventListener('pointerup', () => { active = false; isScrubbing = false; });
            stripEl.addEventListener('pointercancel', () => { active = false; isScrubbing = false; });
        }

        function setupCardDrag(card, clockId) {
            card.addEventListener('dragstart', (e) => {
                if (prefs.sortBy !== 'manual') {
                    e.preventDefault();
                    return;
                }
                draggingId = clockId;
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', clockId);
            });
            card.addEventListener('dragend', () => {
                draggingId = null;
                card.classList.remove('dragging');
                cardRefs.forEach(ref => ref.card.classList.remove('drag-over'));
            });
            card.addEventListener('dragover', (e) => {
                if (!draggingId || draggingId === clockId || prefs.sortBy !== 'manual') return;
                e.preventDefault();
                card.classList.add('drag-over');
            });
            card.addEventListener('dragleave', () => {
                card.classList.remove('drag-over');
            });
            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('drag-over');
                if (!draggingId || draggingId === clockId || prefs.sortBy !== 'manual') return;
                const fromIdx = clocks.findIndex(c => c.id === draggingId);
                const toIdx = clocks.findIndex(c => c.id === clockId);
                if (fromIdx === -1 || toIdx === -1) return;
                const [moved] = clocks.splice(fromIdx, 1);
                clocks.splice(toIdx, 0, moved);
                saveClocks();
                syncGridOrder();
            });
        }

        function updateGridLayout() {
            const count = Math.max(1, clocks.length);
            const rect = clocksContainer.getBoundingClientRect();
            const availW = rect.width || window.innerWidth - 28;
            const availH = rect.height || window.innerHeight * 0.52;
            const gap = Math.max(6, Math.min(13, Math.min(availW, availH) * 0.018));

            const maxRowH = availH > 720 ? 245 : 225;
            const maxCols = Math.min(count, 6);
            let bestCols = 1;
            let bestRows = count;
            let bestScore = -1;

            for (let c = 1; c <= maxCols; c++) {
                const r = Math.ceil(count / c);
                const rawW = (availW - (c - 1) * gap) / c;
                const rawH = (availH - (r - 1) * gap) / r;
                if (rawW <= 20 || rawH <= 20) continue;
                if (c > 2 && rawW < 185) continue;

                const cellW = Math.min(440, rawW);
                const cellH = Math.min(maxRowH, rawH);
                const scale = Math.min(1.16, cellW / 225, cellH / 135);
                const ratio = cellW / cellH;
                const ratioPenalty = (ratio < 1.0 || ratio > 3.2) ? 0.65 : (ratio <= 2.25 ? 1 : 1 - Math.min(0.22, (ratio - 2.25) * 0.16));
                const usedH = r * cellH + (r - 1) * gap;
                const heightFill = Math.min(1, usedH / (availH * 0.80));
                const fillRatio = count / (c * r);
                const score = scale * ratioPenalty * (0.65 + 0.35 * heightFill) + fillRatio * 0.24 + c * 0.003;

                if (score > bestScore) {
                    bestScore = score;
                    bestCols = c;
                    bestRows = r;
                }
            }

            const finalW = (availW - (bestCols - 1) * gap) / bestCols;
            const finalH = Math.min(maxRowH, (availH - (bestRows - 1) * gap) / bestRows);
            const cardScale = Math.max(0.46, Math.min(1.18, finalW / 235, finalH / 148));

            clocksContainer.style.setProperty('--cols', String(bestCols));
            clocksContainer.style.setProperty('--rows', String(bestRows));
            clocksContainer.style.setProperty('--row-max', maxRowH + 'px');
            clocksContainer.style.setProperty('--card-scale', cardScale.toFixed(3));
        }

        function rebuildGrid() {
            const activeIds = new Set(clocks.map(c => c.id));
            for (const [id, ref] of cardRefs.entries()) {
                if (!activeIds.has(id)) {
                    ref.card.remove();
                    cardRefs.delete(id);
                }
            }
            let enterIdx = 0;
            for (const c of clocks) {
                if (!cardRefs.has(c.id)) {
                    const ref = createClockCard(c);
                    ref.card.classList.add('is-entering');
                    ref.card.style.setProperty('--enter-delay', Math.min(enterIdx * 24, 240) + 'ms');
                    setTimeout(() => ref.card.classList.remove('is-entering'), 580);
                    cardRefs.set(c.id, ref);
                    enterIdx++;
                }
            }
            syncGridOrder();
            updateAllCards();
            updateGridLayout();
        }

        function getOrderedClocks(baseDate) {
            if (prefs.sortBy === 'manual') return clocks;
            const targetDate = baseDate || new Date(Date.now() + timeOffsetHours * 3600000);
            const list = [...clocks];
            if (prefs.sortBy === 'offset') {
                list.sort((a, b) => getPartsInZone(targetDate, a.timezone).offsetMinutes - getPartsInZone(targetDate, b.timezone).offsetMinutes);
            } else if (prefs.sortBy === 'online') {
                list.sort((a, b) => {
                    const pa = getPartsInZone(targetDate, a.timezone);
                    const pb = getPartsInZone(targetDate, b.timezone);
                    const wa = (!a.isLocal && isInWorkHours(pa.hour, a.workStart ?? prefs.workStart, a.workEnd ?? prefs.workEnd)) ? 0 : 1;
                    const wb = (!b.isLocal && isInWorkHours(pb.hour, b.workStart ?? prefs.workStart, b.workEnd ?? prefs.workEnd)) ? 0 : 1;
                    if (wa !== wb) return wa - wb;
                    return pa.offsetMinutes - pb.offsetMinutes;
                });
            }
            return list;
        }

        function syncGridOrder() {
            const ordered = getOrderedClocks();
            const isManual = prefs.sortBy === 'manual';
            for (let i = 0; i < ordered.length; i++) {
                const ref = cardRefs.get(ordered[i].id);
                if (!ref) continue;
                ref.card.draggable = isManual;
                ref.card.dataset.sortable = isManual ? 'true' : 'false';
                if (clocksContainer.children[i] !== ref.card) {
                    clocksContainer.appendChild(ref.card);
                }
            }
        }

        function updateAllCards() {
            const baseDate = new Date(Date.now() + timeOffsetHours * 3600000);
            const localTz = getLocalTimeZone();
            const localParts = getPartsInZone(baseDate, localTz);

            let teamCount = 0;
            let onlineCount = 0;

            for (let i = 0; i < clocks.length; i++) {
                const clock = clocks[i];
                const ref = cardRefs.get(clock.id);
                if (!ref) continue;

                const els = ref.els;
                const last = ref.last;

                const parts = getPartsInZone(baseDate, clock.timezone);
                const wStart = clock.workStart ?? prefs.workStart;
                const wEnd = clock.workEnd ?? prefs.workEnd;
                const isWorking = !clock.isLocal && isInWorkHours(parts.hour, wStart, wEnd);

                if (!clock.isLocal) {
                    teamCount++;
                    if (isWorking) onlineCount++;
                }

                if (last.city !== clock.city) {
                    els.cityName.textContent = clock.city;
                    last.city = clock.city;
                }

                const shortZone = formatShortZone(baseDate, clock.timezone);
                const utcStr = formatCompactUTC(parts.offsetMinutes);
                const zoneNamePart = clock.timezone.split('/').pop().replace(/_/g, ' ');
                const dateStr = getFormatter(clock.timezone, 'shortDate').format(baseDate);
                const metaText = shortZone
                    ? `${shortZone} · ${utcStr} · ${dateStr}`
                    : `${zoneNamePart} · ${utcStr} · ${dateStr}`;
                if (last.meta !== metaText) {
                    els.tzMeta.textContent = metaText;
                    last.meta = metaText;
                }

                const statusCode = isWorking ? 'working' : 'off';
                if (last.statusCode !== statusCode) {
                    ref.card.dataset.status = statusCode;
                    last.statusCode = statusCode;
                }

                const statusTagText = isWorking ? 'Online' : (parts.hour >= 6 && parts.hour < 22 ? 'Away' : 'Night');
                if (last.statusTagText !== statusTagText) {
                    els.statusTag.textContent = statusTagText;
                    last.statusTagText = statusTagText;
                }

                const t = formatClockTime(parts.hour, parts.minute, parts.second, prefs.hour12, prefs.showSeconds);
                if (last.hh !== t.hh) {
                    const hadPrev = last.hh !== undefined;
                    els.timeHour.textContent = t.hh;
                    last.hh = t.hh;
                    if (hadPrev && !isScrubbing) triggerClassAnim(els.timeHour, 'digit-pop');
                }
                if (last.mm !== t.mm) {
                    const hadPrev = last.mm !== undefined;
                    els.timeMin.textContent = t.mm;
                    last.mm = t.mm;
                    if (hadPrev && !isScrubbing) triggerClassAnim(els.timeMin, 'digit-pop');
                }
                if (last.sec !== t.sec) {
                    els.timeSec.textContent = t.sec;
                    last.sec = t.sec;
                }
                if (last.ampm !== t.ampm) {
                    els.timeAmpm.textContent = t.ampm;
                    last.ampm = t.ampm;
                }

                if (last.dateStr !== '') {
                    els.dateText.textContent = '';
                    last.dateStr = '';
                }

                const relDiff = clock.isLocal ? '' : (formatRelativeDiff(parts.offsetMinutes - localParts.offsetMinutes) || 'Same');
                if (last.pillText !== relDiff) {
                    if (relDiff) {
                        els.headerPill.textContent = relDiff;
                        els.headerPill.style.display = 'inline-block';
                    } else {
                        els.headerPill.style.display = 'none';
                    }
                    last.pillText = relDiff;
                }

                const dayDiff = Math.round(
                    (Date.UTC(parts.year, parts.month - 1, parts.day) - Date.UTC(localParts.year, localParts.month - 1, localParts.day)) / 86400000
                );
                const dayState = dayDiff === 0 ? '' : String(dayDiff);
                if (last.dayState !== dayState) {
                    if (dayDiff > 0) {
                        els.dayBadge.textContent = `+${dayDiff}d`;
                        els.dayBadge.title = dayDiff === 1 ? 'Tomorrow' : `${dayDiff} days ahead`;
                        els.dayBadge.className = 'day-badge ahead';
                        els.dayBadge.style.display = 'inline-block';
                    } else if (dayDiff < 0) {
                        els.dayBadge.textContent = `${dayDiff}d`;
                        els.dayBadge.title = dayDiff === -1 ? 'Yesterday' : `${Math.abs(dayDiff)} days behind`;
                        els.dayBadge.className = 'day-badge behind';
                        els.dayBadge.style.display = 'inline-block';
                    } else {
                        els.dayBadge.style.display = 'none';
                    }
                    last.dayState = dayState;
                }

                const workKey = `${wStart}-${wEnd}`;
                if (last.workKey !== workKey) {
                    if (wStart < wEnd) {
                        els.workBar.style.display = 'block';
                        els.workBar.style.left = `${(wStart / 24) * 100}%`;
                        els.workBar.style.width = `${((wEnd - wStart) / 24) * 100}%`;
                        els.workBar2.style.display = 'none';
                    } else if (wStart > wEnd) {
                        els.workBar.style.display = 'block';
                        els.workBar.style.left = `${(wStart / 24) * 100}%`;
                        els.workBar.style.width = `${((24 - wStart) / 24) * 100}%`;
                        els.workBar2.style.display = 'block';
                        els.workBar2.style.left = '0%';
                        els.workBar2.style.width = `${(wEnd / 24) * 100}%`;
                    } else {
                        els.workBar.style.display = 'none';
                        els.workBar2.style.display = 'none';
                    }
                    last.workKey = workKey;
                }

                const pct = ((parts.hour * 60 + parts.minute) / 1440) * 100;
                const pctStr = pct.toFixed(2) + '%';
                if (last.pctStr !== pctStr) {
                    els.nowMarker.style.left = pctStr;
                    last.pctStr = pctStr;
                }

                // Update special face mechanics only when that face is active
                if (prefs.face === 'analog') {
                    const hDeg = ((parts.hour % 12) + parts.minute / 60) * 30;
                    const mDeg = (parts.minute + parts.second / 60) * 6;
                    const sDeg = parts.second * 6;
                    els.analogHourEl.setAttribute('transform', `rotate(${hDeg.toFixed(1)} 40 40)`);
                    els.analogMinEl.setAttribute('transform', `rotate(${mDeg.toFixed(1)} 40 40)`);
                    els.analogSecEl.setAttribute('transform', `rotate(${sDeg.toFixed(1)} 40 40)`);
                } else if (prefs.face === 'radial') {
                    const circ = 2 * Math.PI * 33;
                    const spanHours = wStart < wEnd ? (wEnd - wStart) : (24 - wStart + wEnd);
                    const arcLen = (spanHours / 24) * circ;
                    const startDeg = (wStart / 24) * 360 - 90;
                    els.radialArcEl.setAttribute('stroke-dasharray', `${arcLen.toFixed(1)} ${circ.toFixed(1)}`);
                    els.radialArcEl.setAttribute('transform', `rotate(${startDeg.toFixed(1)} 42 42)`);
                    const planetDeg = ((parts.hour + parts.minute / 60) / 24) * 360;
                    els.radialPlanetEl.setAttribute('transform', `rotate(${planetDeg.toFixed(1)} 42 42)`);
                } else if (prefs.face === 'binary') {
                    const h24 = String(parts.hour).padStart(2, '0');
                    const mStr = String(parts.minute).padStart(2, '0');
                    const digits = [+h24[0], +h24[1], +mStr[0], +mStr[1]];
                    for (let c = 0; c < 4; c++) {
                        const dVal = digits[c];
                        for (let row = 0; row < 4; row++) {
                            const bit = 3 - row;
                            els.binaryLeds[c][row].dataset.on = ((dVal >> bit) & 1) ? '1' : '0';
                        }
                    }
                } else if (prefs.face === 'horizon') {
                    const hr = parts.hour + parts.minute / 60;
                    let sky = 'night';
                    if (hr >= 5 && hr < 8) sky = 'dawn';
                    else if (hr >= 8 && hr < 17) sky = 'day';
                    else if (hr >= 17 && hr < 20) sky = 'dusk';
                    ref.card.dataset.sky = sky;
                    const isDay = hr >= 6 && hr < 18;
                    const arcT = isDay ? (hr - 6) / 12 : ((hr >= 18 ? hr - 18 : hr + 6) / 12);
                    const ox = 18 + arcT * 184;
                    const oy = 86 - Math.sin(arcT * Math.PI) * 56;
                    els.horizonOrb.setAttribute('cx', ox.toFixed(1));
                    els.horizonOrb.setAttribute('cy', oy.toFixed(1));
                    els.horizonOrbHalo.setAttribute('cx', ox.toFixed(1));
                    els.horizonOrbHalo.setAttribute('cy', oy.toFixed(1));
                    els.horizonOrb.setAttribute('fill', isDay ? '#fde047' : '#e2e8f0');
                    els.horizonOrbHalo.setAttribute('fill', isDay ? 'rgba(253,224,71,0.28)' : 'rgba(226,232,240,0.20)');
                } else if (prefs.face === 'wordclock') {
                    const lit = getWordClockLitSet(parts.hour, parts.minute);
                    for (let k = 0; k < els.wcChars.length; k++) {
                        els.wcChars[k].dataset.lit = lit.has(k) ? '1' : '0';
                    }
                } else if (prefs.face === 'nixie') {
                    const hStr = t.hh.padStart(2, '0');
                    const mStr = t.mm;
                    els.nixieDigits[0].textContent = hStr[0];
                    els.nixieDigits[1].textContent = hStr[1];
                    els.nixieDigits[2].textContent = mStr[0];
                    els.nixieDigits[3].textContent = mStr[1];
                } else if (prefs.face === 'radar') {
                    const sweepDeg = ((parts.hour * 60 + parts.minute) / 1440) * 360;
                    els.radarSweepEl.setAttribute('transform', `rotate(${sweepDeg.toFixed(1)} 42 42)`);
                    const rad = (sweepDeg - 90) * Math.PI / 180;
                    els.radarBlipEl.setAttribute('cx', (42 + Math.cos(rad) * 22).toFixed(1));
                    els.radarBlipEl.setAttribute('cy', (42 + Math.sin(rad) * 22).toFixed(1));
                } else if (prefs.face === 'gauge') {
                    const gDeg = -120 + ((parts.hour + parts.minute / 60) / 24) * 240;
                    els.gaugeNeedleEl.setAttribute('transform', `rotate(${gDeg.toFixed(1)} 55 48)`);
                } else if (prefs.face === 'wave') {
                    ref.card.style.setProperty('--wave-pct', Math.max(10, Math.min(92, pct)).toFixed(1) + '%');
                } else if (prefs.face === 'tape') {
                    if (last.tapeBg !== t.hh) {
                        els.tapeBg.textContent = t.hh;
                        last.tapeBg = t.hh;
                    }
                } else if (prefs.face === 'hourglass') {
                    const frac = parts.minute / 59;
                    const topH = (1 - frac) * 29;
                    const botH = frac * 29;
                    els.hgTopSand.setAttribute('y', (37 - topH).toFixed(1));
                    els.hgTopSand.setAttribute('height', topH.toFixed(1));
                    els.hgBotSand.setAttribute('y', (68 - botH).toFixed(1));
                    els.hgBotSand.setAttribute('height', botH.toFixed(1));
                }
            }

            if (prefs.sortBy === 'online') {
                syncGridOrder();
            }

            const summaryStr = `${onlineCount} / ${teamCount} team online`;
            if (onlineSummaryText.textContent !== summaryStr) {
                onlineSummaryText.textContent = summaryStr;
            }

            updateTimeControlsReadout(baseDate);
            updateOverlapBars(baseDate);
            drawWorldMap(baseDate);
        }

        let lastOverlapKey = '';
        function updateOverlapBars(baseDate) {
            if (!overlapBarsEl) return;
            const localTz = getLocalTimeZone();
            const lp = getPartsInZone(baseDate, localTz);
            const activeLocalHour = lp.hour;
            const overlapKey = clocks.map(c => `${c.id}:${c.timezone}:${c.workStart ?? ''}:${c.workEnd ?? ''}`).join('|')
                + `|${prefs.workStart}|${prefs.workEnd}|${prefs.hour12}|${activeLocalHour}|${lp.day}`;
            if (overlapKey === lastOverlapKey) return;
            lastOverlapKey = overlapKey;
            const teamClocks = clocks.filter(c => !c.isLocal);
            const totalTeam = Math.max(1, teamClocks.length);

            const counts = new Array(24).fill(0);
            let maxCount = 0;
            let bestHour = activeLocalHour;

            for (let h = 0; h < 24; h++) {
                const diffH = h - activeLocalHour;
                const probe = new Date(baseDate.getTime() + diffH * 3600000);
                let cnt = 0;
                for (let j = 0; j < teamClocks.length; j++) {
                    const c = teamClocks[j];
                    const p = getPartsInZone(probe, c.timezone);
                    if (isInWorkHours(p.hour, c.workStart ?? prefs.workStart, c.workEnd ?? prefs.workEnd)) {
                        cnt++;
                    }
                }
                counts[h] = cnt;
                if (cnt > maxCount) {
                    maxCount = cnt;
                    bestHour = h;
                }
            }

            if (overlapBarsEl.children.length !== 24) {
                overlapBarsEl.innerHTML = '';
                for (let h = 0; h < 24; h++) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'overlap-bar';
                    const fill = document.createElement('span');
                    fill.className = 'overlap-bar-fill';
                    btn.appendChild(fill);
                    btn.addEventListener('click', () => {
                        const nowLocal = getPartsInZone(new Date(), getLocalTimeZone());
                        const nowFloat = nowLocal.hour + nowLocal.minute / 60;
                        let delta = h - nowFloat;
                        if (delta > 12) delta -= 24;
                        if (delta < -12) delta += 24;
                        setTimeOffset(Math.round(delta * 2) / 2);
                    });
                    overlapBarsEl.appendChild(btn);
                }
            }

            for (let h = 0; h < 24; h++) {
                const btn = overlapBarsEl.children[h];
                const fill = btn.firstChild;
                const cnt = counts[h];
                const pct = Math.max(14, Math.round((cnt / totalTeam) * 100));
                fill.style.height = pct + '%';
                btn.dataset.peak = (maxCount > 0 && cnt === maxCount) ? 'true' : 'false';
                btn.dataset.active = (h === activeLocalHour) ? 'true' : 'false';
                btn.title = `${formatHourCompact(h)} local · ${cnt}/${teamClocks.length} team online`;
            }

            if (overlapBestText) {
                overlapBestText.textContent = maxCount > 0
                    ? `Peak: ${formatHourCompact(bestHour)} (${maxCount}/${teamClocks.length})`
                    : '';
            }
        }

        // --- Designer Particle World Map Engine ---
        function decodeLandDots() {
            if (landDots) return landDots;
            landDots = [];
            const total = MAP_COLS * MAP_ROWS;
            let bitIdx = 0;
            for (let i = 0; i < MAP_PACKED.length && bitIdx < total; i++) {
                const val = MAP_ALPHA.indexOf(MAP_PACKED[i]);
                for (let b = 5; b >= 0 && bitIdx < total; b--) {
                    if ((val >> b) & 1) {
                        const r = Math.floor(bitIdx / MAP_COLS);
                        const c = bitIdx % MAP_COLS;
                        const lat = 76 - (r / (MAP_ROWS - 1)) * 134;
                        const lon = -180 + ((c + (r % 2 === 1 ? 0.5 : 0)) / MAP_COLS) * 360;
                        landDots.push({ r, c, lat, lon });
                    }
                    bitIdx++;
                }
            }
            return landDots;
        }

        function getSunPosition(date) {
            // Day of year & subsolar lat/lon
            const startOfYear = Date.UTC(date.getUTCFullYear(), 0, 1);
            const doy = (date.getTime() - startOfYear) / 86400000;
            const declDeg = -23.44 * Math.cos((2 * Math.PI / 365) * (doy + 10));
            const utcHours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
            let subLon = (12 - utcHours) * 15;
            if (subLon > 180) subLon -= 360;
            if (subLon < -180) subLon += 360;
            return { latRad: declDeg * Math.PI / 180, lonRad: subLon * Math.PI / 180, declDeg, subLon };
        }

        function getClockCoords(clock, offsetMinutes) {
            if (TZ_COORDS[clock.timezone]) return TZ_COORDS[clock.timezone];
            // Fallback: estimate longitude from UTC offset, latitude by continent prefix
            const estLon = Math.max(-175, Math.min(175, (offsetMinutes / 60) * 15));
            const tz = clock.timezone;
            let estLat = 25;
            if (tz.startsWith('Europe/')) estLat = 49;
            else if (tz.startsWith('Australia/')) estLat = -28;
            else if (tz.startsWith('Africa/')) estLat = 4;
            else if (tz.startsWith('America/Argentina') || tz.startsWith('America/Santiago') || tz.startsWith('America/Sao_Paulo')) estLat = -24;
            else if (tz.startsWith('America/')) estLat = 37;
            else if (tz.startsWith('Asia/')) estLat = 30;
            return [estLat, estLon];
        }

        function projectGeo(lat, lon, padX, padY, plotW, plotH) {
            const x = padX + ((lon + 180) / 360) * plotW;
            const y = padY + ((76 - lat) / 134) * plotH;
            return [x, y];
        }

        function drawWorldMap(overrideDate) {
            if (!prefs.showMap || !worldMapCanvas) return;
            const rect = mapCanvasWrap.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            if (w <= 0 || h <= 0) return;

            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const targetW = Math.round(w * dpr);
            const targetH = Math.round(h * dpr);
            if (worldMapCanvas.width !== targetW || worldMapCanvas.height !== targetH) {
                worldMapCanvas.width = targetW;
                worldMapCanvas.height = targetH;
            }

            const ctx = worldMapCanvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, w, h);

            const isDark = getActiveTheme() === 'dark';
            const baseDate = overrideDate || new Date(Date.now() + timeOffsetHours * 3600000);
            const sun = getSunPosition(baseDate);
            const dots = decodeLandDots();

            const outerPadX = w < 520 ? 10 : 16;
            const outerPadY = w < 520 ? 8 : 12;
            const availW = w - outerPadX * 2;
            const availH = h - outerPadY * 2;
            const targetRatio = 2.9;
            let plotW = availW;
            let plotH = availH;
            if (availW / availH > targetRatio) {
                plotW = availH * targetRatio;
            } else {
                plotH = availW / targetRatio;
            }
            const padX = (w - plotW) / 2;
            const padY = (h - plotH) / 2;
            const baseDotR = Math.max(1.25, Math.min(2.4, plotW / 320));

            // Subtle equator + tropic guide lines
            ctx.save();
            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(28,25,23,0.045)';
            ctx.lineWidth = 1;
            const eqY = padY + (76 / 134) * plotH;
            ctx.beginPath();
            ctx.moveTo(padX, eqY);
            ctx.lineTo(padX + plotW, eqY);
            ctx.stroke();
            ctx.restore();

            // Soft daylight atmospheric glow on canvas
            const [sunX, sunY] = projectGeo(sun.declDeg, sun.subLon, padX, padY, plotW, plotH);
            const glowGrad = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, plotW * 0.42);
            if (isDark) {
                glowGrad.addColorStop(0, 'rgba(238, 175, 58, 0.13)');
                glowGrad.addColorStop(0.55, 'rgba(238, 175, 58, 0.04)');
                glowGrad.addColorStop(1, 'rgba(238, 175, 58, 0)');
            } else {
                glowGrad.addColorStop(0, 'rgba(238, 175, 58, 0.16)');
                glowGrad.addColorStop(0.55, 'rgba(238, 175, 58, 0.05)');
                glowGrad.addColorStop(1, 'rgba(238, 175, 58, 0)');
            }
            ctx.fillStyle = glowGrad;
            ctx.fillRect(0, 0, w, h);

            // Render hex-staggered particle dots with solar terminator shading
            const sinDecl = Math.sin(sun.latRad);
            const cosDecl = Math.cos(sun.latRad);
            const DEG2RAD = Math.PI / 180;

            for (let i = 0; i < dots.length; i++) {
                const d = dots[i];
                const [px, py] = projectGeo(d.lat, d.lon, padX, padY, plotW, plotH);
                const latR = d.lat * DEG2RAD;
                const dLon = d.lon * DEG2RAD - sun.lonRad;
                const sinElev = Math.sin(latR) * sinDecl + Math.cos(latR) * cosDecl * Math.cos(dLon);

                // Smooth twilight transition between -0.14 and +0.16 solar elevation
                const dayMix = Math.max(0, Math.min(1, (sinElev + 0.14) / 0.30));
                const twilight = Math.max(0, 1 - Math.abs(sinElev) / 0.16);

                let r = baseDotR * (0.82 + 0.28 * dayMix);
                if (isDark) {
                    const alpha = 0.16 + 0.34 * dayMix + 0.10 * twilight;
                    const red = Math.round(115 + 115 * dayMix + 25 * twilight);
                    const green = Math.round(135 + 65 * dayMix + 15 * twilight);
                    const blue = Math.round(165 - 60 * dayMix);
                    ctx.fillStyle = `rgba(${red},${green},${blue},${alpha.toFixed(2)})`;
                } else {
                    const alpha = 0.22 + 0.36 * dayMix + 0.12 * twilight;
                    const red = Math.round(110 + 95 * dayMix + 25 * twilight);
                    const green = Math.round(105 + 40 * dayMix);
                    const blue = Math.round(102 - 68 * dayMix);
                    ctx.fillStyle = `rgba(${red},${green},${blue},${alpha.toFixed(2)})`;
                }

                ctx.beginPath();
                ctx.arc(px, py, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // Subtle subsolar point indicator
            ctx.save();
            ctx.beginPath();
            ctx.arc(sunX, sunY, 3, 0, Math.PI * 2);
            ctx.fillStyle = isDark ? 'rgba(253, 224, 71, 0.75)' : 'rgba(217, 119, 6, 0.65)';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(sunX, sunY, 7, 0, Math.PI * 2);
            ctx.strokeStyle = isDark ? 'rgba(253, 224, 71, 0.28)' : 'rgba(217, 119, 6, 0.25)';
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            // Draw team pins & build hitboxes
            mapPinHitboxes = [];
            const pins = clocks.map(clock => {
                const parts = getPartsInZone(baseDate, clock.timezone);
                const wStart = clock.workStart ?? prefs.workStart;
                const wEnd = clock.workEnd ?? prefs.workEnd;
                const isWorking = !clock.isLocal && isInWorkHours(parts.hour, wStart, wEnd);
                const [lat, lon] = getClockCoords(clock, parts.offsetMinutes);
                const [px, py] = projectGeo(lat, lon, padX, padY, plotW, plotH);
                const t = formatClockTime(parts.hour, parts.minute, 0, prefs.hour12, false);
                return {
                    clock,
                    px,
                    py,
                    isWorking,
                    timeText: t.main + (t.ampm ? ' ' + t.ampm : ''),
                    priority: clock.id === hoveredClockId ? 3 : (clock.isLocal ? 2 : (isWorking ? 1 : 0))
                };
            });

            // Draw lower-priority pins first so hovered & online pins sit on top
            pins.sort((a, b) => a.priority - b.priority);

            for (let i = 0; i < pins.length; i++) {
                const p = pins[i];
                const isHovered = p.clock.id === hoveredClockId;
                const pinR = isHovered ? 6 : (p.isWorking || p.clock.isLocal ? 4.8 : 3.8);

                // Soft halo for online / local / hovered pins
                if (p.isWorking || p.clock.isLocal || isHovered) {
                    ctx.beginPath();
                    ctx.arc(p.px, p.py, isHovered ? 13 : 10, 0, Math.PI * 2);
                    if (p.clock.isLocal) {
                        ctx.fillStyle = isDark ? 'rgba(56, 189, 248, 0.24)' : 'rgba(54, 181, 176, 0.26)';
                    } else if (p.isWorking) {
                        ctx.fillStyle = 'rgba(238, 175, 58, 0.30)';
                    } else {
                        ctx.fillStyle = isDark ? 'rgba(241, 245, 249, 0.16)' : 'rgba(28, 25, 23, 0.14)';
                    }
                    ctx.fill();
                }

                // Pin body
                ctx.beginPath();
                ctx.arc(p.px, p.py, pinR, 0, Math.PI * 2);
                if (p.clock.isLocal) {
                    ctx.fillStyle = isDark ? '#38bdf8' : '#36b5b0';
                } else if (p.isWorking) {
                    ctx.fillStyle = isDark ? '#e8a832' : '#eeaf3a';
                } else {
                    ctx.fillStyle = isDark ? '#64748b' : '#94a3b8';
                }
                ctx.fill();

                ctx.lineWidth = isHovered ? 2 : 1.5;
                ctx.strokeStyle = isDark ? '#0f141b' : '#ffffff';
                ctx.stroke();

                mapPinHitboxes.push(p);
            }

            // Crisp non-overlapping city labels on spacious maps
            if (plotW >= 410 && plotH >= 145) {
                const placedBoxes = [];
                ctx.font = '600 11px "Inter", -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.textBaseline = 'middle';

                // Draw highest-priority labels first (hovered -> local -> online -> offline)
                for (let i = pins.length - 1; i >= 0; i--) {
                    const p = pins[i];
                    if (p.clock.id === hoveredClockId) continue; // tooltip already shows hovered pin
                    const label = p.clock.isLocal ? 'You' : p.clock.city;
                    const textW = ctx.measureText(label).width;
                    const lx = p.px + 8;
                    const ly = p.py;
                    const box = {
                        x1: lx - 2,
                        y1: ly - 7,
                        x2: lx + textW + 4,
                        y2: ly + 7
                    };
                    if (box.x2 > w - 8) continue;

                    let overlaps = false;
                    for (let j = 0; j < placedBoxes.length; j++) {
                        const b = placedBoxes[j];
                        if (!(box.x2 < b.x1 || box.x1 > b.x2 || box.y2 < b.y1 || box.y1 > b.y2)) {
                            overlaps = true;
                            break;
                        }
                    }
                    if (overlaps) continue;
                    placedBoxes.push(box);

                    ctx.fillStyle = isDark ? 'rgba(15, 20, 27, 0.72)' : 'rgba(255, 255, 255, 0.78)';
                    ctx.beginPath();
                    ctx.roundRect(box.x1, box.y1, box.x2 - box.x1, box.y2 - box.y1, 4);
                    ctx.fill();

                    ctx.fillStyle = p.isWorking
                        ? (isDark ? '#fde68a' : '#78350f')
                        : (isDark ? '#cbd5e1' : '#334155');
                    ctx.fillText(label, lx + 1, ly + 0.5);
                }
            }
        }

        function handleMapPointerMove(clientX, clientY) {
            const rect = worldMapCanvas.getBoundingClientRect();
            const mx = clientX - rect.left;
            const my = clientY - rect.top;

            let best = null;
            let bestDist = 18 * 18;
            for (let i = mapPinHitboxes.length - 1; i >= 0; i--) {
                const p = mapPinHitboxes[i];
                const dx = p.px - mx;
                const dy = p.py - my;
                const d2 = dx * dx + dy * dy;
                if (d2 < bestDist) {
                    bestDist = d2;
                    best = p;
                }
            }

            const nextId = best ? best.clock.id : null;
            if (nextId !== hoveredClockId) {
                if (hoveredClockId && cardRefs.has(hoveredClockId)) {
                    cardRefs.get(hoveredClockId).card.classList.remove('map-highlight');
                }
                hoveredClockId = nextId;
                if (hoveredClockId && cardRefs.has(hoveredClockId)) {
                    cardRefs.get(hoveredClockId).card.classList.add('map-highlight');
                }
                drawWorldMap();
            }

            if (best) {
                worldMapCanvas.style.cursor = 'pointer';
                const stateLabel = best.clock.isLocal ? 'You' : (best.isWorking ? 'Online' : 'Offline');
                mapTooltip.textContent = `${best.clock.city} · ${best.timeText} · ${stateLabel}`;
                const clampedX = Math.max(70, Math.min(rect.width - 70, best.px));
                const clampedY = Math.max(36, best.py);
                mapTooltip.style.left = clampedX + 'px';
                mapTooltip.style.top = clampedY + 'px';
                mapTooltip.setAttribute('data-visible', 'true');
            } else {
                worldMapCanvas.style.cursor = 'default';
                mapTooltip.setAttribute('data-visible', 'false');
            }
        }

        worldMapCanvas.addEventListener('mousemove', (e) => handleMapPointerMove(e.clientX, e.clientY));
        worldMapCanvas.addEventListener('mouseleave', () => {
            if (hoveredClockId && cardRefs.has(hoveredClockId)) {
                cardRefs.get(hoveredClockId).card.classList.remove('map-highlight');
            }
            hoveredClockId = null;
            mapTooltip.setAttribute('data-visible', 'false');
            worldMapCanvas.style.cursor = 'default';
            drawWorldMap();
        });
        worldMapCanvas.addEventListener('click', (e) => {
            handleMapPointerMove(e.clientX, e.clientY);
            if (hoveredClockId && cardRefs.has(hoveredClockId)) {
                const targetCard = cardRefs.get(hoveredClockId).card;
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetCard.classList.add('map-highlight');
                setTimeout(() => targetCard.classList.remove('map-highlight'), 900);
            }
        });

        window.addEventListener('resize', () => {
            updateGridLayout();
            if (prefs.showMap) drawWorldMap();
        });

        function updateTimeControlsReadout(baseDate) {
            const localTz = getLocalTimeZone();
            const lp = getPartsInZone(baseDate, localTz);
            const lt = formatClockTime(lp.hour, lp.minute, lp.second, prefs.hour12, false);
            const localDate = getFormatter(localTz, 'shortDate').format(baseDate);
            const sign = timeOffsetHours > 0 ? '+' : '';
            timeTravelValue.textContent = `${sign}${timeOffsetHours} hours`;
            timeTravelReadout.textContent = `${localDate}, ${lt.main}${lt.ampm ? ' ' + lt.ampm : ''}`;
        }

        function scheduleNextTick() {
            clearTimeout(tickTimerId);
            if (document.hidden) return;
            const nowMs = Date.now();
            const interval = prefs.showSeconds ? 1000 : 60000;
            const delay = (interval - (nowMs % interval)) + 25;
            tickTimerId = setTimeout(() => {
                updateAllCards();
                scheduleNextTick();
            }, delay);
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateAllCards();
                scheduleNextTick();
            } else {
                clearTimeout(tickTimerId);
            }
        });

        function setTimeOffset(hours) {
            const clamped = Math.max(-24, Math.min(24, Math.round(hours * 2) / 2));
            timeOffsetHours = clamped;
            timeTravelSlider.value = String(clamped);
            if (!rafPending) {
                rafPending = true;
                requestAnimationFrame(() => {
                    rafPending = false;
                    updateAllCards();
                });
            }
        }

        timeTravelSlider.addEventListener('pointerdown', () => { isScrubbing = true; });
        timeTravelSlider.addEventListener('pointerup', () => { isScrubbing = false; });
        timeTravelSlider.addEventListener('pointercancel', () => { isScrubbing = false; });
        timeTravelSlider.addEventListener('input', (e) => {
            setTimeOffset(parseFloat(e.target.value));
        });
        timeTravelSlider.addEventListener('dblclick', () => {
            setTimeOffset(0);
            showToast('Time reset to current');
        });
        stepBackBtn.addEventListener('click', () => setTimeOffset(timeOffsetHours - 1));
        stepFwdBtn.addEventListener('click', () => setTimeOffset(timeOffsetHours + 1));
        resetTimeBtn.addEventListener('click', () => {
            setTimeOffset(0);
            showToast('Time reset to current');
        });

        async function copyText(text, successMsg) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(successMsg);
            } catch (e) {
                showToast('Unable to copy to clipboard');
            }
        }

        function copySingleTime(clockId) {
            const clock = clocks.find(c => c.id === clockId);
            if (!clock) return;
            const baseDate = new Date(Date.now() + timeOffsetHours * 3600000);
            const p = getPartsInZone(baseDate, clock.timezone);
            const t = formatClockTime(p.hour, p.minute, p.second, prefs.hour12, false);
            const d = getFormatter(clock.timezone, 'shortDate').format(baseDate);
            copyText(`${clock.city}: ${t.main}${t.ampm ? ' ' + t.ampm : ''} (${d})`, `Copied ${clock.city} time`);
        }

        copySummaryBtn.addEventListener('click', () => {
            const baseDate = new Date(Date.now() + timeOffsetHours * 3600000);
            const ordered = getOrderedClocks(baseDate);
            const lines = ordered.map(c => {
                const p = getPartsInZone(baseDate, c.timezone);
                const t = formatClockTime(p.hour, p.minute, p.second, prefs.hour12, false);
                const d = getFormatter(c.timezone, 'shortDate').format(baseDate);
                return `${c.city}: ${t.main}${t.ampm ? ' ' + t.ampm : ''} (${d})`;
            });
            copyText(lines.join('\n'), `Copied ${ordered.length} team times`);
        });

        // --- Add Clock Modal ---
        function openAddModal() {
            addModal.setAttribute('data-open', 'true');
            tzSearchInput.value = '';
            customCityName.value = '';
            renderSearchResults('');
            setTimeout(() => tzSearchInput.focus(), 30);
        }

        function closeAddModal() {
            addModal.setAttribute('data-open', 'false');
        }

        function renderSearchResults(query) {
            const q = query.trim().toLowerCase();
            if (!q) {
                filteredResults = searchCatalog.slice(0, 18);
            } else {
                const terms = q.split(/\s+/);
                filteredResults = [];
                for (let i = 0; i < searchCatalog.length; i++) {
                    const item = searchCatalog[i];
                    let match = true;
                    for (let j = 0; j < terms.length; j++) {
                        if (!item.search.includes(terms[j])) {
                            match = false;
                            break;
                        }
                    }
                    if (match) {
                        filteredResults.push(item);
                        if (filteredResults.length >= 25) break;
                    }
                }
            }

            selectedResultIdx = 0;
            tzSearchResults.innerHTML = '';

            if (filteredResults.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'search-empty';
                empty.textContent = 'No matching cities or timezones found.';
                tzSearchResults.appendChild(empty);
                return;
            }

            const now = new Date(Date.now() + timeOffsetHours * 3600000);
            const frag = document.createDocumentFragment();

            filteredResults.forEach((item, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'search-item';
                btn.setAttribute('role', 'option');
                btn.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');

                const main = document.createElement('div');
                main.className = 'search-item-main';
                const cityEl = document.createElement('div');
                cityEl.className = 'search-item-city';
                cityEl.textContent = `${getFlagForTimezone(item.timezone)} ${item.city}`;
                const zoneEl = document.createElement('div');
                zoneEl.className = 'search-item-zone';
                zoneEl.textContent = `${item.sub} · ${item.timezone.replace(/_/g, ' ')}`;
                main.appendChild(cityEl);
                main.appendChild(zoneEl);

                const p = getPartsInZone(now, item.timezone);
                const t = formatClockTime(p.hour, p.minute, 0, prefs.hour12, false);
                const timeEl = document.createElement('span');
                timeEl.className = 'search-item-time';
                timeEl.textContent = t.main + (t.ampm ? ' ' + t.ampm : '');

                btn.appendChild(main);
                btn.appendChild(timeEl);

                btn.addEventListener('click', () => {
                    selectedResultIdx = idx;
                    updateSearchSelection();
                });
                btn.addEventListener('dblclick', () => {
                    selectedResultIdx = idx;
                    commitAddClock();
                });

                frag.appendChild(btn);
            });

            tzSearchResults.appendChild(frag);
        }

        function updateSearchSelection() {
            const items = tzSearchResults.querySelectorAll('.search-item');
            items.forEach((el, i) => {
                const active = i === selectedResultIdx;
                el.setAttribute('aria-selected', active ? 'true' : 'false');
                if (active) el.scrollIntoView({ block: 'nearest' });
            });
        }

        function commitAddClock() {
            const pick = filteredResults[selectedResultIdx];
            if (!pick) {
                showToast('Select a timezone from the list');
                return;
            }
            const label = customCityName.value.trim() || pick.city;
            const exists = clocks.some(c => c.timezone === pick.timezone && c.city.toLowerCase() === label.toLowerCase());
            if (exists) {
                triggerClassAnim(customCityName.value.trim() ? customCityName : tzSearchInput, 'shake-error');
                showToast(`${label} is already displayed`);
                return;
            }

            clocks.push({
                id: uid(),
                city: label.slice(0, 48),
                timezone: pick.timezone
            });
            saveClocks();
            rebuildGrid();
            closeAddModal();
            showToast(`${label} clock added`);
        }

        openAddModalBtn.addEventListener('click', openAddModal);
        closeAddModalBtn.addEventListener('click', closeAddModal);
        cancelAddBtn.addEventListener('click', closeAddModal);
        confirmAddBtn.addEventListener('click', commitAddClock);
        addModal.addEventListener('click', (e) => { if (e.target === addModal) closeAddModal(); });

        tzSearchInput.addEventListener('input', (e) => renderSearchResults(e.target.value));
        tzSearchInput.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (filteredResults.length > 0) {
                    selectedResultIdx = (selectedResultIdx + 1) % filteredResults.length;
                    updateSearchSelection();
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (filteredResults.length > 0) {
                    selectedResultIdx = (selectedResultIdx - 1 + filteredResults.length) % filteredResults.length;
                    updateSearchSelection();
                }
            } else if (e.key === 'Enter') {
                e.preventDefault();
                commitAddClock();
            }
        });
        customCityName.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                commitAddClock();
            }
        });

        // --- Edit Clock Modal ---
        function populateHourSelect(selectEl) {
            selectEl.innerHTML = '';
            for (let h = 0; h < 24; h++) {
                const opt = document.createElement('option');
                opt.value = String(h);
                opt.textContent = formatHourCompact(h);
                selectEl.appendChild(opt);
            }
        }

        function openEditModal(clockId) {
            const clock = clocks.find(c => c.id === clockId);
            if (!clock) return;
            editingClockId = clockId;
            editCityInput.value = clock.city;
            populateHourSelect(editWorkStart);
            populateHourSelect(editWorkEnd);
            editWorkStart.value = String(clock.workStart ?? prefs.workStart);
            editWorkEnd.value = String(clock.workEnd ?? prefs.workEnd);
            editModal.setAttribute('data-open', 'true');
            setTimeout(() => editCityInput.focus(), 30);
        }

        function closeEditModal() {
            editModal.setAttribute('data-open', 'false');
            editingClockId = null;
        }

        saveEditBtn.addEventListener('click', () => {
            const clock = clocks.find(c => c.id === editingClockId);
            if (!clock) return;
            const nextName = editCityInput.value.trim();
            if (!nextName) {
                triggerClassAnim(editCityInput, 'shake-error');
                showToast('Label cannot be empty');
                return;
            }
            clock.city = nextName.slice(0, 48);
            const ws = parseInt(editWorkStart.value, 10);
            const we = parseInt(editWorkEnd.value, 10);
            clock.workStart = ws === prefs.workStart ? null : ws;
            clock.workEnd = we === prefs.workEnd ? null : we;
            saveClocks();
            updateAllCards();
            closeEditModal();
            showToast('Clock updated');
        });

        closeEditModalBtn.addEventListener('click', closeEditModal);
        cancelEditBtn.addEventListener('click', closeEditModal);
        editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });

        function removeClock(clockId) {
            const idx = clocks.findIndex(c => c.id === clockId);
            if (idx === -1 || clocks[idx].isLocal) return;
            const removed = clocks.splice(idx, 1)[0];
            saveClocks();
            rebuildGrid();
            showToast(`${removed.city} clock removed`);
        }

        function buildFaceGrid() {
            faceGrid.innerHTML = '';
            for (const f of CLOCK_FACES) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'face-option';
                btn.dataset.faceId = f.id;
                btn.setAttribute('aria-pressed', String(prefs.face === f.id));

                const sw = document.createElement('span');
                sw.className = 'face-swatch';
                sw.style.background = f.bg;
                sw.style.color = f.fg;
                sw.textContent = f.icon;

                const lbl = document.createElement('span');
                lbl.textContent = f.label;

                btn.appendChild(sw);
                btn.appendChild(lbl);
                btn.addEventListener('click', () => {
                    prefs.face = f.id;
                    savePrefs();
                    syncToolbarUI();
                    updateAllCards();
                });
                faceGrid.appendChild(btn);
            }
        }

        function syncToolbarUI() {
            clocksContainer.dataset.face = prefs.face;
            if (faceGrid.children.length !== CLOCK_FACES.length) buildFaceGrid();
            for (const btn of faceGrid.children) {
                btn.setAttribute('aria-pressed', String(btn.dataset.faceId === prefs.face));
            }
            fmtSegmented.dataset.active = prefs.hour12 ? '12' : '24';
            fmt24Btn.setAttribute('aria-pressed', String(!prefs.hour12));
            fmt12Btn.setAttribute('aria-pressed', String(prefs.hour12));
            sortSelect.value = prefs.sortBy;
            secondsSwitch.setAttribute('aria-checked', String(prefs.showSeconds));
            mapToggleBtn.setAttribute('aria-pressed', String(prefs.showMap));
            mapCard.hidden = !prefs.showMap;
            mainWrap.dataset.hasMap = prefs.showMap ? 'true' : 'false';
            populateHourSelect(workStartSelect);
            populateHourSelect(workEndSelect);
            workStartSelect.value = String(prefs.workStart);
            workEndSelect.value = String(prefs.workEnd);
        }

        mapToggleBtn.addEventListener('click', () => {
            prefs.showMap = !prefs.showMap;
            savePrefs();
            syncToolbarUI();
            updateGridLayout();
            if (prefs.showMap) drawWorldMap();
        });

        fmt24Btn.addEventListener('click', () => {
            prefs.hour12 = false;
            savePrefs();
            syncToolbarUI();
            updateAllCards();
        });

        fmt12Btn.addEventListener('click', () => {
            prefs.hour12 = true;
            savePrefs();
            syncToolbarUI();
            updateAllCards();
        });

        sortSelect.addEventListener('change', (e) => {
            prefs.sortBy = e.target.value;
            savePrefs();
            syncGridOrder();
        });

        secondsSwitch.addEventListener('click', () => {
            prefs.showSeconds = !prefs.showSeconds;
            savePrefs();
            syncToolbarUI();
            updateAllCards();
            scheduleNextTick();
        });

        workStartSelect.addEventListener('change', (e) => {
            prefs.workStart = parseInt(e.target.value, 10);
            savePrefs();
            updateAllCards();
        });

        workEndSelect.addEventListener('change', (e) => {
            prefs.workEnd = parseInt(e.target.value, 10);
            savePrefs();
            updateAllCards();
        });

        resetDefaultsBtn.addEventListener('click', () => {
            const currentLocalTz = getLocalTimeZone();
            clocks = DEFAULT_CLOCKS.map(c => ({ ...c, timezone: c.isLocal ? currentLocalTz : c.timezone }));
            saveClocks();
            rebuildGrid();
            settingsPopover.setAttribute('data-open', 'false');
            settingsBtn.setAttribute('aria-expanded', 'false');
            showToast('Restored default clocks');
        });

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = settingsPopover.getAttribute('data-open') === 'true';
            settingsPopover.setAttribute('data-open', String(!open));
            settingsBtn.setAttribute('aria-expanded', String(!open));
        });

        document.addEventListener('click', (e) => {
            if (settingsPopover.getAttribute('data-open') === 'true' && !settingsPopover.contains(e.target) && e.target !== settingsBtn) {
                settingsPopover.setAttribute('data-open', 'false');
                settingsBtn.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                if (addModal.getAttribute('data-open') === 'true') closeAddModal();
                else openAddModal();
                return;
            }
            if (e.key === 'Escape') {
                closeAddModal();
                closeEditModal();
                settingsPopover.setAttribute('data-open', 'false');
                settingsBtn.setAttribute('aria-expanded', 'false');
            }
        });

        function init() {
            const isMac = navigator.platform && /mac/i.test(navigator.platform);
            shortcutHint.textContent = isMac ? '⌘K' : 'Ctrl K';

            applyTheme(getActiveTheme());
            loadPrefs();
            loadClocks();
            buildSearchCatalog();
            syncToolbarUI();
            rebuildGrid();
            scheduleNextTick();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
